name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacja narzedzi bezpieczeństwa
        run: |
          pip install -r requirements.txt
          pip install bandit safety pip-audit

      - name: Bandit - skan kodu Python
        run: bandit -r . -x ./venv,./.venv

      - name: Safety - sprawdzenie narzedzia
        run: safety --version

      - name: Skan podatnosci zaleznosci Python
        run: pip-audit -r requirements.txt