name: Celery Redis Tests

on:
  push:
  pull_request:

jobs:
  celery-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacja zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchomienie Celery worker
        run: |
          celery -A config worker --loglevel=info > celery.log 2>&1 &
          sleep 5

      - name: Test polaczenia z Celery
        run: celery -A config inspect ping

      - name: Testy taskow
        run: python manage.py test core